name: Automated data refresh

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh universities JSON
        run: python scripts/scraper.py

      - name: Generate university pages
        run: python scripts/generate_pages.py

      - name: Check for generated changes
        id: changes
        run: |
          if [[ -z "$(git status --porcelain -- data/universities.json universities)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No data or page changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected changes in data or generated pages."
          fi

      - name: Commit and push updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universities.json universities
          git commit -m "Automated Monthly Update [$(date -u +%F)]"
          git push origin HEAD:main
