<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somali-UniGuide</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="index">
    <header class="site-header">
      <div class="container">
        <div class="brand">
          <h1>Somali-UniGuide</h1>
          <p>Free university guidance for Somali students.</p>
        </div>
        <div class="search-panel">
          <label class="search-label" for="searchInput">Search universities</label>
          <input
            id="searchInput"
            type="search"
            placeholder="Search by university, city, or department..."
            aria-label="Search universities"
          />
          <div class="filters">
            <label>
              City
              <select id="cityFilter" aria-label="Filter by city"></select>
            </label>
            <label>
              Department
              <select id="departmentFilter" aria-label="Filter by department"></select>
            </label>
            <label>
              Scholarships
              <select id="scholarshipFilter" aria-label="Filter by scholarship availability">
                <option value="all">All</option>
                <option value="available">Available</option>
                <option value="unavailable">Not available</option>
              </select>
            </label>
            <label>
              Status
              <select id="statusFilter" aria-label="Filter by university status">
                <option value="all">All</option>
                <option value="public">Public</option>
                <option value="private">Private</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="summary">
        <div id="summaryText">Loading universities...</div>
      </section>
      <section>
        <div id="universityList" class="university-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Built with GitHub Pages + GitHub Actions + Python automation.</p>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
