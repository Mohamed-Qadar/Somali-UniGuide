<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puntland State University | Somali-UniGuide</title>
    <style>
      :root {
        --primary: #0f766e;
        --primary-dark: #0f4c4a;
        --text: #0f172a;
        --muted: #64748b;
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.6;
      }
      .header {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        padding: 2rem 0;
      }
      .container {
        width: min(1080px, 92%);
        margin: 0 auto;
      }
      .back-link {
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .title {
        margin: 0.5rem 0 0;
      }
      .subtitle {
        margin: 0.4rem 0 0;
        color: rgba(255, 255, 255, 0.85);
      }
      .grid {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        margin: 2rem 0 3rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.25rem;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      }
      .card h2 {
        margin-top: 0;
        margin-bottom: 0.75rem;
        font-size: 1.1rem;
      }
      ul {
        margin: 0;
        padding-left: 1.2rem;
      }
      .muted {
        color: var(--muted);
      }
      a {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a class="back-link" href="../index.html">← Back to home</a>
        <h1 class="title">Puntland State University</h1>
        <p class="subtitle">Galkayo</p>
      </div>
    </header>
    <main class="container">
      <div class="grid">
        <section class="card">
          <h2>Overview</h2>
          <p class="muted"><strong>Rector:</strong> Dr. Mohamoud Hamid Mohamed</p>
          <p class="muted"><strong>Website:</strong> <a href="https://psu.edu.so" target="_blank" rel="noopener noreferrer">https://psu.edu.so</a></p>
        </section>
        <section class="card">
          <h2>Departments</h2>
          <ul><li>Engineering</li><li>Economics &amp; Management</li><li>Education</li><li>Law</li></ul>
        </section>
      </div>
    </main>
  </body>
</html>
